[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "zhiyin-lite"
version = "0.1.0"
description = "Lightweight Agent capability decay defense — state machine + tool constraint + drift sentinel"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["agent", "ai", "state-machine", "tool-constraint", "drift-detection", "llm"]

[project.urls]
Homepage = "https://github.com/konghuihua/zhiyin-lite"
Repository = "https://github.com/konghuihua/zhiyin-lite"
Issues = "https://github.com/konghuihua/zhiyin-lite/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
zhiyin = ["*.pyi"]
